<style>
        /* Performance and accessibility refinements */
        img { max-width: 100%; height: auto; }
        a, button { -webkit-tap-highlight-color: transparent; }
        button:focus-visible, a:focus-visible { outline: 2px solid var(--neon-cyan); outline-offset: 3px; }
        @media (hover: none) { .google-premier-badge { animation: none; } }
        @media (max-width: 768px) {
            .payment-badges { flex-wrap: wrap; }
            .pricing-card { min-width: 0; }
        }
    </style>
    <style>
        :root {
            --bg-base: #030712;
            --bg-card: rgba(10, 22, 44, 0.7);
            --border-glow: rgba(56, 189, 248, 0.25);
            --primary-accent: #0284c7;
            --neon-blue: #38bdf8;
            --neon-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; scroll-padding-top: 90px; }
        @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            line-height: 1.8;
            background-image: 
                radial-gradient(ellipse at 80% 10%, rgba(2, 132, 199, 0.15), transparent 50%),
                radial-gradient(ellipse at 20% 60%, rgba(6, 182, 212, 0.12), transparent 50%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .hidden { display: none !important; }

        header {
            backdrop-filter: blur(16px);
            background: rgba(3, 7, 18, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container { max-width: 1340px; width: 100%; margin: 0 auto; padding: 0 20px; }

        .nav-wrapper { display: flex; justify-content: space-between; align-items: center; }

        .brand-logo { font-size: 1.25rem; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .brand-logo img { width: 32px; height: 32px; filter: drop-shadow(0 0 8px var(--neon-cyan)); }

        .nav-links { display: flex; list-style: none; gap: 24px; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s ease; }
        .nav-links a:hover { color: var(--neon-blue); }

        .nav-dashboard-btn {
            background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 6px 14px; border-radius: 8px; color: var(--neon-cyan) !important; font-weight: 600 !important;
        }

        .language-toggle { border: 1px solid rgba(56,189,248,.35); background: rgba(56,189,248,.08); color: var(--neon-blue); border-radius: 9px; padding: 8px 13px; font: 700 .85rem Arial,sans-serif; cursor: pointer; margin-inline-start: 12px; }
        html[lang="en"] body { font-family: Arial, Helvetica, sans-serif; direction: ltr; }
        html[lang="en"] .monitor-screen, html[lang="en"] .iphone-screen { text-align: left; }
        html[lang="en"] .partner-content p, html[lang="en"] .why-card-new p, html[lang="en"] .stats-content p { text-align: left; }
        @media (max-width: 768px) { .language-toggle { margin-inline-start: auto; margin-inline-end: 8px; } }

        .menu-toggle {
            display: none; width: 40px; height: 40px; border: 1px solid rgba(56, 189, 248, 0.28);
            border-radius: 10px; background: rgba(56, 189, 248, 0.08); color: var(--neon-blue);
            cursor: pointer; font-size: 1.2rem; align-items: center; justify-content: center;
        }

        .mobile-menu { display: none; padding: 8px 0 18px; border-top: 1px solid rgba(255,255,255,0.07); margin-top: 12px; }
        .mobile-menu.is-open { display: block; }
        .mobile-menu ul { list-style: none; display: grid; gap: 6px; }
        .mobile-menu a { display: block; padding: 10px 14px; border-radius: 8px; color: var(--text-muted); text-decoration: none; }

        /* Hero */
        .hero { padding: 60px 0 50px; text-align: center; position: relative; }
        .badge {
            display: inline-block; padding: 6px 18px; border-radius: 9999px;
            background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--neon-blue); font-size: 0.85rem; font-weight: 600; margin-bottom: 16px;
        }
        .hero h1 { font-size: 2.6rem; font-weight: 900; margin-bottom: 12px; background: linear-gradient(135deg, #ffffff 30%, var(--neon-cyan) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { max-width: 680px; margin: 0 auto 28px; color: var(--text-muted); font-size: 1.1rem; }

        /* Hero 3D Devices */
        .scene-outer-wrapper {
            width: 100%; max-width: 640px; height: 430px; margin: 10px auto 36px;
            display: flex; justify-content: center; align-items: flex-start; position: relative; z-index: 2;
        }
        .scene-stage { width: 640px; height: 430px; perspective: 1400px; transform-origin: top center; flex-shrink: 0; position: relative; }
        .device-3d-group { position: relative; width: 640px; height: 430px; transform-style: preserve-3d; transition: transform 0.12s ease-out; }
        
        .monitor-wrapper-pos { position: absolute; top: 0; right: 0; width: 560px; transform: translateZ(-20px); }
        .monitor-frame {
            width: 560px; height: 320px; background: #0f172a; border: 4px solid #334155; border-radius: 18px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), 0 0 35px rgba(6, 182, 212, 0.22); display: flex; flex-direction: column; overflow: hidden;
        }
        .monitor-screen { background: var(--bg-base); flex: 1; padding: 18px; overflow: hidden; position: relative; }
        
        /* Footer Custom Link Update */
        /* طراحی فوتر و اعمال لینک برانکس | Branex به آدرس branex.ir */
        /* در انتهای فایل فوتر به صورت زیر بروزرسانی شده است */
        <footer>

            </div>
        </footer>
