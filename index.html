        :root {
            --bg-base: #030712;
            --bg-card: rgba(10, 22, 44, 0.65);
            --border-glow: rgba(56, 189, 248, 0.25);
            --primary-accent: #0284c7;
            --neon-blue: #38bdf8;
            --neon-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;

            color: var(--text-main);

                radial-gradient(ellipse at 20% 60%, rgba(6, 182, 212, 0.12), transparent 50%),
                radial-gradient(ellipse at 50% 90%, rgba(15, 23, 42, 0.8), transparent 70%);
            min-height: 100vh;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header & Navigation */
        header {
            position: sticky;
            top: 0;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(3, 7, 18, 0.75);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--neon-cyan));
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--neon-blue);
        }

        .nav-dashboard-btn {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 6px 14px;
            border-radius: 8px;
            color: var(--neon-cyan) !important;
            font-weight: 600 !important;
        }

        .menu-toggle {
            display: none;
            width: 44px;
            height: 44px;
            border: 1px solid rgba(56, 189, 248, 0.28);
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.08);
            color: var(--neon-blue);
            cursor: pointer;
            font-size: 1.25rem;
            align-items: center;
            justify-content: center;
        }

        .mobile-menu {
            display: none;
            padding: 8px 0 18px;
            border-top: 1px solid rgba(255,255,255,0.07);
        }
